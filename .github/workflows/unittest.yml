name: lint and unit tests

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0', ruby-head]

    # Ruby 3.1 is not available on Ubuntu 26.04.
    runs-on: ${{ matrix.ruby == '3.1' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    continue-on-error: ${{ matrix.ruby == 'ruby-head' }}

    env:
      UNIT_TEST: true

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
    - name: Install dependencies
      run: |
        bundle install
    - name: Run tests
      run: |
        bundle exec rake rubocop
        bundle exec rake steep
        bundle exec rake test:unit
        APPIUM_DRIVER=espresso bundle exec rake test:unit:android
        APPIUM_DRIVER=appium bundle exec rake test:unit

  test-win:
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']

    runs-on: windows-latest

    env:
      UNIT_TEST: true

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install dependencies
        run: |
          gem install ffi
          bundle install
          gem uninstall --force eventmachine && gem install eventmachine --platform ruby -- --with-ldflags="-Wl,-undefined,dynamic_lookup"
      - name: Run tests
        run: |
          bundle exec rake test:unit

          $env:APPIUM_DRIVER = 'espresso'
          bundle exec rake test:unit:android

          $env:APPIUM_DRIVER = 'appium'
          bundle exec rake test:unit
