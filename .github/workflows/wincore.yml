name: WinCore functional tests

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        appium: [3, 4]
    name: Windows (Appium ${{ matrix.appium }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - run: npm install --global appium@${{ matrix.appium }}
      - run: appium driver install --source=npm appium-wincore-driver@${{ matrix.appium }}

      - name: Start Appium
        run: |
          $server = Start-Process appium.cmd -ArgumentList '--address 127.0.0.1 --log appium.log --log-no-colors' -PassThru
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            if ($server.HasExited) { throw "Appium exited with code $($server.ExitCode)" }
            try {
              if ((Invoke-RestMethod http://127.0.0.1:4723/status -TimeoutSec 2).value.ready) { return }
            } catch { }
            Start-Sleep -Seconds 1
          }
          throw 'Appium did not become ready'

      - name: Run WinCore functional tests
        run: bundle exec ruby -Itest test/functional/windows/wincore_test.rb

      - name: Show Appium log on failure
        if: failure()
        run: if (Test-Path appium.log) { Get-Content appium.log -Tail 250 }
