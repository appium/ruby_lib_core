name: Functional Tests

on:
  # Run by manual at this time
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
    - '.github/**'
    - 'docs/**'
    - '*.md'
    # Release-only merges do not need functional tests.
    - '.release-please-manifest.json'
    - 'lib/appium_lib_core/version.rb'
  pull_request:
    branches: [ master ]
    paths-ignore:
    - '.github/**'
    - 'docs/**'
    - '*.md'
    # Release-only merges do not need functional tests.
    - '.release-please-manifest.json'
    - 'lib/appium_lib_core/version.rb'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # pull_request branch filters apply to the base branch, so skip release PRs here.
  ios_test:
    name: iOS ${{ matrix.test_targets.name }} (Appium ${{ matrix.appium.version }})
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    strategy:
      fail-fast: false
      matrix:
        appium: &appium_versions
          - version: 3
            wincore: appium-wincore-driver@3
            xcuitest: xcuitest@12
            uiautomator2: uiautomator2@8
            espresso: espresso@9
            images: images@5
            execute_driver: execute-driver@7
          - version: 4
            wincore: appium-wincore-driver@4
            xcuitest: xcuitest@13
            uiautomator2: uiautomator2@10
            espresso: espresso@11
            images: images@6
            execute_driver: execute-driver@9
        test_targets:
          - target: test/functional/ios/driver_test.rb,test/functional/ios/patch_test.rb
            name: test1
            platform: ios
            wdaName: WebDriverAgentRunner-Runner.app
          - target: test/functional/ios/webdriver/create_session_test.rb,test/functional/ios/webdriver/w3c_actions_test.rb
            name: test2
            platform: ios
            wdaName: WebDriverAgentRunner-Runner.app
          - target: test/functional/ios/webdriver/device_test.rb
            name: test3
            platform: ios
            wdaName: WebDriverAgentRunner-Runner.app
          - target: test/functional/ios/ios/device_test.rb
            name: test4
            platform: ios
            wdaName: WebDriverAgentRunner-Runner.app
          - target: test/functional/ios/ios/device_wda_attachment_test.rb,test/functional/ios/ios/search_context_test.rb
            name: test5
            platform: ios
            wdaName: WebDriverAgentRunner-Runner.app
          - target: test/functional/ios/ios/image_comparison_test.rb
            name: test6
            platform: ios
            wdaName: WebDriverAgentRunner-Runner.app
          - target: test/functional/ios/tv_driver_test.rb
            name: test7
            platform: tvOS
            wdaName: WebDriverAgentRunner_tvOS-Runner.app

    runs-on: macos-26

    # Please make sure the available Xcode versions and iOS versions
    # on the runner images. https://github.com/actions/runner-images
    env:
      XCODE_VERSION: 26.4
      IOS_VERSION: 26.4
      IOS_DEVICE_NAME: iPhone 17

    steps:
    - uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}
    - run: defaults write com.apple.iphonesimulator PasteboardAutomaticSync -bool false

    - uses: futureware-tech/simulator-action@v6
      with:
        # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
        model: ${{ env.IOS_DEVICE_NAME }}
        os_version: ${{ env.IOS_VERSION }}
        wait_for_boot: true
        shutdown_after_job: false

    # Start Appium
    - run: npm install -g appium@${{ matrix.appium.version }}
    - run: |
        appium driver install ${{ matrix.appium.xcuitest }}
        appium plugin install ${{ matrix.appium.images }}
        appium plugin install ${{ matrix.appium.execute_driver }}
        nohup appium --use-plugins=images,execute-driver --relaxed-security --log-timestamp --log-no-colors 2>&1 > appium.log &

    - run: |
        appium driver run xcuitest download-wda-sim --platform=${{matrix.test_targets.platform}} --outdir=${{github.workspace}}/wda
      name: Downloading prebuilt WDA

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 4.0
    - name: Install dependencies
      run: bundle install

    # Run tests
    - run: bundle exec rake test:func:ios TESTS=${{matrix.test_targets.target}}
      name: Run tests
      env:
        APPIUM_VERSION: ${{ matrix.appium.version }}
        IGNORE_VERSION_SKIP: true
        CI: true
        LOCAL_PREBUILT_WDA: ${{ github.workspace }}/wda/${{matrix.test_targets.wdaName}}

    - name: Save server output
      if: ${{ always() }}
      uses: actions/upload-artifact@master
      with:
        name: appium-${{ matrix.appium.version }}-ios-${{matrix.test_targets.name}}.log
        path: |
          appium.log
          test/report/

  ios_test_with_other_deps:
    name: iOS with other dependencies (Appium ${{ matrix.appium.version }})
    strategy:
      fail-fast: false
      matrix:
        appium: *appium_versions
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: macos-26

    # Please make sure the available Xcode versions and iOS versions
    # on the runner images. https://github.com/actions/runner-images
    env:
      XCODE_VERSION: 26.4
      IOS_VERSION: 26.4
      IOS_DEVICE_NAME: iPhone 17

    steps:
    - uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ env.XCODE_VERSION }}
    - run: defaults write com.apple.iphonesimulator PasteboardAutomaticSync -bool false

    - uses: futureware-tech/simulator-action@v6
      with:
      # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
        model: ${{ env.IOS_DEVICE_NAME }}
        os_version: ${{ env.IOS_VERSION }}
        wait_for_boot: true
        shutdown_after_job: false

    - name: Preparing other environment
      run: |
        brew install ffmpeg

    # Start Appium
    - run: npm root -g
    - name: Install appium and mjpeg-consumer
      run: |
        npm install -g appium@${{ matrix.appium.version }}
        npm install -g mjpeg-consumer
    - run: |
        appium driver install ${{ matrix.appium.xcuitest }}
        appium plugin install ${{ matrix.appium.images }}
        appium plugin install ${{ matrix.appium.execute_driver }}
        nohup appium --use-plugins=images,execute-driver --relaxed-security --log-timestamp --log-no-colors 2>&1 > appium.log &

    - run: |
        appium driver run xcuitest download-wda-sim --platform=ios --outdir=${{github.workspace}}/wda
      name: Downloading prebuilt WDA

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2
    - name: Install dependencies
      run: bundle install

    - run: bundle exec rake test:func:ios TESTS=test/functional/ios/ios/mjpeg_server_test.rb,test/functional/ios/ios/mobile_commands_test.rb
      name: Run tests
      env:
        IGNORE_VERSION_SKIP: true
        CI: true
        LOCAL_PREBUILT_WDA: ${{ github.workspace }}/wda/WebDriverAgentRunner-Runner.app

    - name: Save server output
      if: ${{ always() }}
      uses: actions/upload-artifact@master
      with:
        name: appium-${{ matrix.appium.version }}-ios_test_with_other_deps.log
        path: |
          appium.log
          test/report/

  android_test:
    name: Android ${{ matrix.test_targets.automation_name }} ${{ matrix.test_targets.name }} (Appium ${{ matrix.appium.version }})
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        appium: *appium_versions
        test_targets:
          - target: test/functional/android/driver_test.rb,test/functional/android/patch_test.rb,test/functional/android/android/device_test.rb,test/functional/android/android/search_context_test.rb
            automation_name: uiautomator2
            name: test1
          - target: test/functional/android/driver_test.rb,test/functional/android/patch_test.rb,test/functional/android/android/device_test.rb,test/functional/android/android/search_context_test.rb
            automation_name: espresso
            name: test2
          - target: test/functional/android/webdriver/create_session_test.rb,test/functional/android/webdriver/device_test.rb,test/functional/android/webdriver/w3c_actions_test.rb
            automation_name: uiautomator2
            name: test3
          - target: test/functional/android/webdriver/create_session_test.rb,test/functional/android/webdriver/device_test.rb,test/functional/android/webdriver/w3c_actions_test.rb
            automation_name: espresso
            name: test4
          - target: test/functional/android/android/mobile_commands_test.rb
            automation_name: uiautomator2
            name: test5
          - target: test/functional/android/android/mobile_commands_test.rb
            automation_name: espresso
            name: test6
          - target: test/functional/android/android/device_data_test.rb
            automation_name: uiautomator2
            name: test7
          - target: test/functional/android/android/device_data_test.rb
            automation_name: espresso
            name: test8
          - target: test/functional/android/android/mjpeg_server_test.rb,test/functional/android/android/image_comparison_test.rb
            automation_name: uiautomator2
            name: test9
          - target: test/functional/android/android/mjpeg_server_test.rb,test/functional/android/android/image_comparison_test.rb
            automation_name: espresso
            name: test10
          - target: test/functional/android/webdriver/bidi_test.rb
            automation_name: uiautomator2
            name: test11
          - target: test/functional/android/webdriver/bidi_test.rb
            automation_name: espresso
            name: test12

    env:
      API_LEVEL: 36
      ARCH: x86_64

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    # Start Appium
    - run: npm install -g appium@${{ matrix.appium.version }}
    - run: |
        appium driver install ${{ matrix.appium[matrix.test_targets.automation_name] }}
        appium plugin install ${{ matrix.appium.images }}
        appium plugin install ${{ matrix.appium.execute_driver }}
        nohup appium --use-plugins=images,execute-driver --relaxed-security --log-timestamp --log-no-colors 2>&1 > appium.log &

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: AVD cache
      uses: actions/cache@v6
      id: avd-cache
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-${{ env.API_LEVEL }}
    - name: create AVD and generate snapshot for caching
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ env.API_LEVEL }}
        arch: ${{ env.ARCH }}
        target: google_apis
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: false
        script: echo "Generated AVD snapshot for caching."

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2
    - name: Install dependencies
      run: bundle install

    # Run tests

    - name: run tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ env.API_LEVEL }}
        arch: ${{ env.ARCH }}
        script: |
          bundle exec rake test:func:android TESTS=${{matrix.test_targets.target}}
        target: google_apis
        profile: Nexus 5X
        disable-spellchecker: true
        disable-animations: true
      env:
        ANDROID_SDK_VERSION: ${{ env.API_LEVEL }}
        APPIUM_VERSION: ${{ matrix.appium.version }}
        APPIUM_DRIVER: ${{matrix.test_targets.automation_name}}
        IGNORE_VERSION_SKIP: true
        CI: true

    - name: Save server output
      if: ${{ always() }}
      uses: actions/upload-artifact@master
      with:
        name: appium-${{ matrix.appium.version }}-android-${{matrix.test_targets.automation_name}}-${{matrix.test_targets.name}}.log
        path: |
          appium.log
          test/report/

  windows_test:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        appium: *appium_versions
    name: Windows (Appium ${{ matrix.appium.version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - run: npm install --global appium@${{ matrix.appium.version }}
      - run: appium driver install --source=npm ${{ matrix.appium.wincore }}

      - name: Start Appium
        run: |
          $server = Start-Process appium.cmd -ArgumentList '--address 127.0.0.1 --log appium.log --log-no-colors' -PassThru
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            if ($server.HasExited) { throw "Appium exited with code $($server.ExitCode)" }
            try {
              if ((Invoke-RestMethod http://127.0.0.1:4723/status -TimeoutSec 2).value.ready) { return }
            } catch { }
            Start-Sleep -Seconds 1
          }
          throw 'Appium did not become ready'

      - name: Run WinCore functional tests
        run: bundle exec ruby -Itest test/functional/windows/wincore_test.rb

      - name: Show Appium log on failure
        if: failure()
        run: if (Test-Path appium.log) { Get-Content appium.log -Tail 250 }
